<!DOCTYPE html>
<html>

<head>
    <title>Default theme: star citizen</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="button-background">
        <div class="main-panel">
            <div class="button-row">
                <button emulate-key="u" class="control-button">Power</button>
                <button emulate-key="i" class="control-button">Engines</button>
                <button emulate-key="o" class="control-button">Shields</button>
                <button emulate-key="p" class="control-button">Weapons</button>
            </div>
            <div class="button-row">
                <button emulate-key="Alt_R+h" class="control-button">Decoy +</button>
                <button emulate-key="Alt_L+h" class="control-button">Decoy -</button>
                <input emulate-slider="1" class="control-slider" type="range" min="1" max="255" value="50">
            </div>
            <div class="button-row">
                <button emulate-key="equal" class="control-button">Open all doors</button>
                <button emulate-key="minus" class="control-button">Close all doors</button>
                <button emulate-key="l" class="control-button">Lights</button>
                <button emulate-key="m" class="control-button">Mining/Salvage mode</button>
                <button emulate-key="v" class="control-button">Scan mode</button>
            </div>
            <h1 style="text-align: center;">pagination etc</h1>
        </div>
    </div>
</body>

</html>
