<!DOCTYPE html>
<html>

<head>
    <title>Default theme: star citizen</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="button-background">
        <div class="main-panel">
            <div class="button-row">
                <button emulate-button="0" class="control-button">Power</button>
                <button emulate-button="1" class="control-button">Engines</button>
                <button emulate-button="2" class="control-button">Shields</button>
                <button emulate-button="3" class="control-button">Weapons</button>
            </div>
            <div class="button-row">
                <button emulate-button="4" class="control-button">Decoy +</button>
                <button emulate-button="5" class="control-button">Decoy -</button>
                <input emulate-slider="0" class="control-slider" type="range" min="0" max="255" value="50">
            </div>
            <div class="button-row">
                <button emulate-button="6" class="control-button">Open all doors</button>
                <button emulate-button="7" class="control-button">Close all doors</button>
                <button emulate-button="8" class="control-button">Lights</button>
                <button emulate-button="9" class="control-button">Mining/Salvage mode</button>
                <button emulate-button="10" class="control-button">Scan mode</button>
            </div>
            <h1 style="text-align: center;">pagination etc</h1>
        </div>
    </div>
</body>

</html>
