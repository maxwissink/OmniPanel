<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OmniPanel: Star Citizen</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <button id="fullscreen-btn" class="fullscreen-toggle">
        ENTER FULLSCREEN
    </button>
    <div class="deck-viewport">
        <div class="deck-wrapper">

            <section id="page1" class="main-panel button-background">
                <div class="sticky-title-container">
                    <span class="status-value">GENERAL SYSTEMS</span>
                </div>
                <div class="button-row">
                    <div class="filler"></div>
                    <button virtual-joystick="2" emulate-button="0" class="control-button light">Reset pips</button>
                    <button virtual-joystick="0" emulate-button="0" class="control-button critical">Power</button>
                    <button virtual-joystick="0" emulate-button="1" class="control-button important">Engines</button>
                    <button virtual-joystick="0" emulate-button="2" class="control-button important">Shields</button>
                    <button virtual-joystick="0" emulate-button="3" class="control-button important">Weapons</button>
                </div>
                <div class="button-row">
                    <button virtual-joystick="0" emulate-button="4" class="control-button light">Open doors</button>
                    <button virtual-joystick="0" emulate-button="5" class="control-button light">Close doors</button>
                    <button virtual-joystick="0" emulate-button="6" class="control-button light">Lock doors</button>
                    <button virtual-joystick="0" emulate-button="7" class="control-button light">Unlock doors</button>
                    <button virtual-joystick="0" emulate-button="8" class="control-button light">Port Lock</button>
                    <button virtual-joystick="0" emulate-button="9" class="control-button light">Port Unlock</button>
                </div>
                <div class="button-row">
                    <button virtual-joystick="0" emulate-button="10" class="control-button">Scan mode</button>
                    <button virtual-joystick="0" emulate-button="11" class="control-button">VTOL</button>
                    <button virtual-joystick="0" emulate-button="12" class="control-button">Cruise control</button>
                    <button virtual-joystick="0" emulate-button="13" class="control-button">Request landing</button>
                </div>
                <div class="button-row">
                    <button virtual-joystick="0" emulate-button="14" class="control-button">Self repair all</button>
                    <button virtual-joystick="0" emulate-button="15" class="control-button">Diagnostics<br>(Hold) Resource network </button>
                    <button virtual-joystick="1" emulate-button="0" class="control-button">Lights</button>
                    <button virtual-joystick="1" emulate-button="1" class="control-button">Night Vision</button>
                </div>
            </section>

            <section id="page2" class="main-panel button-background">
                <div class="sticky-title-container">
                    <span class="status-value">COMBAT SYSTEMS</span>
                </div>
                <div class="button-row">
                    <div class="filler"></div>
                    <button virtual-joystick="2" emulate-button="0" class="control-button light">Reset pips</button>
                    <button virtual-joystick="0" emulate-button="0" class="control-button critical">Power</button>
                    <button virtual-joystick="0" emulate-button="1" class="control-button important">Engines</button>
                    <button virtual-joystick="0" emulate-button="2" class="control-button important">Shields</button>
                    <button virtual-joystick="0" emulate-button="3" class="control-button important">Weapons</button>
                </div>
                <div class="button-row">
                    <button virtual-joystick="1" emulate-button="2" class="control-button">Missile +</button>
                    <button virtual-joystick="1" emulate-button="3" class="control-button">Missile -</button>
                    <div class="filler"></div>
                    <button virtual-joystick="1" emulate-button="6" class="control-button light">+ power engines</br>(Hold) Max engines</button>
                    <button virtual-joystick="1" emulate-button="7" class="control-button light">+ power shields</br>(Hold) Max shields</button>
                    <button virtual-joystick="1" emulate-button="8" class="control-button light">+ power weapons</br>(Hold) Max weapons</button>
                </div>
                <div class="button-row">
                    <button virtual-joystick="1" emulate-button="4" class="control-button">Decoy +</button>
                    <button virtual-joystick="1" emulate-button="5" class="control-button">Decoy -</button>
                    <div class="filler"></div>
                    <div class="filler"></div>
                </div>
                <div class="button-row">
                    <button virtual-joystick="0" emulate-button="14" class="control-button">Self repair all</button>
                    <button virtual-joystick="0" emulate-button="15" class="control-button">Diagnostics<br>(Hold) Resource network </button>
                    <button virtual-joystick="1" emulate-button="0" class="control-button">Lights</button>
                    <button virtual-joystick="1" emulate-button="1" class="control-button">Night Vision</button>
                </div>
            </section>

            <section id="page3" class="main-panel button-background">
                <div class="sticky-title-container">
                    <span class="status-value">MINING SYSTEMS</span>
                </div>
                <div class="button-row">
                    <div class="filler"></div>
                    <button virtual-joystick="2" emulate-button="0" class="control-button light">Reset pips</button>
                    <button virtual-joystick="0" emulate-button="0" class="control-button critical">Power</button>
                    <button virtual-joystick="0" emulate-button="1" class="control-button important">Engines</button>
                    <button virtual-joystick="0" emulate-button="2" class="control-button important">Shields</button>
                    <button virtual-joystick="0" emulate-button="3" class="control-button important">Weapons</button>
                </div>
                <div class="button-row">
                    <button virtual-joystick="1" emulate-button="0" class="control-button light">Open doors</button>
                    <button virtual-joystick="1" emulate-button="1" class="control-button light">Close doors</button>
                    <button virtual-joystick="1" emulate-button="2" class="control-button light">Lock doors</button>
                    <button virtual-joystick="1" emulate-button="3" class="control-button light">Unlock doors</button>
                    <button virtual-joystick="1" emulate-button="4" class="control-button light">Port Lock</button>
                    <button virtual-joystick="1" emulate-button="5" class="control-button light">Port Unlock</button>
                </div>
                <div class="button-row">
                    <button virtual-joystick="1" emulate-button="9" class="control-button">Mining/ Salvage mode</button>
                    <div class="slider-container-4">
                        <input virtual-joystick="1" emulate-slider="1" class="control-slider" type="range" min="0" max="255" value="0">
                    </div>
                    <button virtual-joystick="1" emulate-button="10" class="control-button">Switch Mining Laser</button>

                </div>
                <div class="button-row">
                    <button virtual-joystick="1" emulate-button="11" class="control-button">mining module slot 1</button>
                    <button virtual-joystick="1" emulate-button="12" class="control-button">mining module slot 2</button>
                    <button virtual-joystick="1" emulate-button="13" class="control-button">mining module slot 3</button>
                    <button virtual-joystick="1" emulate-button="14" class="control-button">mining module slot 4</button>
                    <div class="filler"></div>
                    <button virtual-joystick="1" emulate-button="15" class="control-button critical">jettison cargo</button>
                </div>
            </section>


            <section id="page4" class="main-panel button-background">
                <div class="sticky-title-container">
                    <span class="status-value">SALVAGE SYSTEMS</span>
                </div>
                <div class="button-row">
                    <div class="filler"></div>
                    <button virtual-joystick="2" emulate-button="0" class="control-button light">Reset pips</button>
                    <button virtual-joystick="0" emulate-button="0" class="control-button critical">Power</button>
                    <button virtual-joystick="0" emulate-button="1" class="control-button important">Engines</button>
                    <button virtual-joystick="0" emulate-button="2" class="control-button important">Shields</button>
                    <button virtual-joystick="0" emulate-button="3" class="control-button important">Weapons</button>
                </div>
                <div class="button-row">
                    <button virtual-joystick="1" emulate-button="0" class="control-button light">Open doors</button>
                    <button virtual-joystick="1" emulate-button="1" class="control-button light">Close doors</button>
                    <button virtual-joystick="1" emulate-button="2" class="control-button light">Lock doors</button>
                    <button virtual-joystick="1" emulate-button="3" class="control-button light">Unlock doors</button>
                    <button virtual-joystick="1" emulate-button="4" class="control-button light">Port Lock</button>
                    <button virtual-joystick="1" emulate-button="5" class="control-button light">Port Unlock</button>
                </div>
                <div class="button-row">
                    <button virtual-joystick="1" emulate-button="9" class="control-button">Mining/ Salvage mode</button>
                    <div class="slider-container-4">
                        <input virtual-joystick="1" emulate-slider="1" class="control-slider" type="range" min="0" max="255" value="0">
                    </div>
                    <button virtual-joystick="1" emulate-button="10" class="control-button">Cycle modifiers</button>

                </div>
                <div class="button-row">
                    <button virtual-joystick="1" emulate-button="11" class="control-button">Scraping tool</button>
                    <button virtual-joystick="1" emulate-button="12" class="control-button">Fracture tool</button>
                    <button virtual-joystick="1" emulate-button="13" class="control-button">Disintegrate tool</button>
                    <div class="filler"></div>
                    <div class="filler"></div>
                </div>
            </section>
        </div>
    </div>

    <nav class="mfd-nav">
        <a href="#page1" class="nav-item">GENERAL</a>
        <a href="#page2" class="nav-item">COMBAT</a>
        <a href="#page3" class="nav-item">MINING</a>
        <a href="#page4" class="nav-item">SALVAGE</a>
    </nav>

</body>
</html>
