<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OmniPanel: Star Citizen</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <button id="fullscreen-btn" class="fullscreen-toggle">
        ENTER FULLSCREEN
    </button>
    <div class="deck-viewport">
        <div class="deck-wrapper">

            <section id="page1" class="main-panel button-background">
                <div class="sticky-title-container">
                    <span class="status-value">GENERAL SYSTEMS</span>
                </div>
                <div class="button-row">
                    <button virtual-joystick="0" emulate-button="0" class="control-button">Power</button>
                    <button virtual-joystick="0" emulate-button="1" class="control-button">Engines</button>
                    <button virtual-joystick="0" emulate-button="2" class="control-button">Shields</button>
                    <button virtual-joystick="0" emulate-button="3" class="control-button">Weapons</button>
                </div>
                <div class="button-row">
                    <button virtual-joystick="0" emulate-button="4" class="control-button">Decoy +</button>
                    <button virtual-joystick="0" emulate-button="5" class="control-button">Decoy -</button>
                    <button virtual-joystick="0" emulate-button="11" class="control-button">Missile +</button>
                    <button virtual-joystick="0" emulate-button="12" class="control-button">Missile -</button>
                    <!-- <div class="slider-container">
                        <input emulate-slider="0" class="control-slider" type="range" min="0" max="255" value="128">
                    </div> -->
                </div>
                <div class="button-row">
                    <button virtual-joystick="0" emulate-button="6" class="control-button">Self repair all</button>
                    <button virtual-joystick="0" emulate-button="7" class="control-button">Diagnostics<br>(Hold) Resource network </button>
                    <button virtual-joystick="0" emulate-button="8" class="control-button">Lights</button>
                    <button virtual-joystick="0" emulate-button="9" class="control-button">Night Vision</button>
                </div>
            </section>

            <section id="page2" class="main-panel button-background">
                <div class="sticky-title-container">
                    <span class="status-value">COMBAT SYSTEMS</span>
                </div>
                <div class="button-row">
                    <button virtual-joystick="0" emulate-button="0" class="control-button">Power</button>
                    <button virtual-joystick="0" emulate-button="1" class="control-button">Engines</button>
                    <button virtual-joystick="0" emulate-button="2" class="control-button">Shields</button>
                    <button virtual-joystick="0" emulate-button="3" class="control-button">Weapons</button>
                </div>
                <div class="button-row">
                    <button virtual-joystick="0" emulate-button="4" class="control-button">Decoy +</button>
                    <button virtual-joystick="0" emulate-button="5" class="control-button">Decoy -</button>
                    <button virtual-joystick="0" emulate-button="11" class="control-button">Missile +</button>
                    <button virtual-joystick="0" emulate-button="12" class="control-button">Missile -</button>
                    <!-- <div class="slider-container">
                        <input emulate-slider="0" class="control-slider" type="range" min="0" max="255" value="128">
                    </div> -->
                </div>
                <div class="button-row">
                    <button virtual-joystick="0" emulate-button="6" class="control-button">Self repair all</button>
                    <button virtual-joystick="0" emulate-button="7" class="control-button">Diagnostics<br>(Hold) Resource network </button>
                    <button virtual-joystick="0" emulate-button="8" class="control-button">Lights</button>
                    <button virtual-joystick="0" emulate-button="9" class="control-button">Night Vision</button>
                </div>
            </section>

            <section id="page3" class="main-panel button-background">
                <div class="sticky-title-container">
                    <span class="status-value">MINING SYSTEMS</span>
                </div>
                <div class="button-row">
                    <button virtual-joystick="0" emulate-button="0" class="control-button">Power</button>
                    <button virtual-joystick="0" emulate-button="1" class="control-button">Engines</button>
                    <button virtual-joystick="0" emulate-button="2" class="control-button">Shields</button>
                    <button virtual-joystick="0" emulate-button="3" class="control-button">Weapons</button>
                    <button virtual-joystick="1" emulate-button="6" class="control-button">Toggle Ports</button>
                    <button virtual-joystick="1" emulate-button="7" class="control-button">Toggle Doors</button>
                </div>
                <div class="button-row">
                    <button virtual-joystick="1" emulate-button="8" class="control-button">Mining/Salvage mode</button>
                    <div class="slider-container-4">
                        <input virtual-joystick="1" emulate-slider="1" class="control-slider" type="range" min="0" max="255" value="0">
                    </div>
                    <button virtual-joystick="1" emulate-button="9" class="control-button">Switch Mining Laser</button>

                </div>
                <div class="button-row">
                    <button virtual-joystick="1" emulate-button="0" class="control-button">Open doors</button>
                    <button virtual-joystick="1" emulate-button="1" class="control-button">Close doors</button>
                    <button virtual-joystick="1" emulate-button="2" class="control-button">Lock doors</button>
                    <button virtual-joystick="1" emulate-button="3" class="control-button">Unlock doors</button>
                    <button virtual-joystick="1" emulate-button="4" class="control-button">Port Lock</button>
                    <button virtual-joystick="1" emulate-button="5" class="control-button">Port Unlock</button>
                </div>
            </section>


            <section id="page4" class="main-panel button-background">
                <div class="sticky-title-container">
                    <span class="status-value">SALVAGE SYSTEMS</span>
                </div>
                <div class="button-row">
                    <button virtual-joystick="1" emulate-button="0" class="control-button">Open doors</button>
                    <button virtual-joystick="1" emulate-button="1" class="control-button">Close doors</button>
                    <button virtual-joystick="1" emulate-button="2" class="control-button">Lock doors</button>
                    <button virtual-joystick="1" emulate-button="3" class="control-button">Unlock doors</button>
                    <button virtual-joystick="1" emulate-button="4" class="control-button">Port Lock</button>
                    <button virtual-joystick="1" emulate-button="5" class="control-button">Port Unlock</button>
                </div>
                <div class="button-row">
                    <button virtual-joystick="1" emulate-button="8" class="control-button">Mining/Salvage mode</button>
                    <div class="slider-container-4">
                        <input virtual-joystick="1" emulate-slider="1" class="control-slider" type="range" min="0" max="255" value="0">
                    </div>
                    <button virtual-joystick="1" emulate-button="9" class="control-button">Switch Mining Laser</button>

                </div>
                <div class="button-row">
                    <button virtual-joystick="1" emulate-button="6" class="control-button">Quantum</button>
                    <button virtual-joystick="1" emulate-button="7" class="control-button">Jettison</button>
                </div>
            </section>
        </div>
    </div>

    <nav class="mfd-nav">
        <a href="#page1" class="nav-item">GENERAL</a>
        <a href="#page2" class="nav-item">COMBAT</a>
        <a href="#page3" class="nav-item">MINING</a>
        <a href="#page4" class="nav-item">SALVAGE</a>
    </nav>

</body>

</html>
