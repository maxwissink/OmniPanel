<settings 
    width="80" type-width="number" min-width="10" max-width="100"
    height="80" type-height="number" min-height="10" max-height="100"
    label="Click Me" type-label="string"
    color="green" type-color="color"
    joystick="0" type-joystick="number" min-joystick="0" max-joystick="9"
    button="0" type-button="number" min-button="0" max-button="15"
></settings>
<style>
    .simple-button {
        width: 100%;
        height: 100%;
        background-color: settings-color;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .simple-button button {
        width: settings-width%;
        height: settings-height%;
    }
</style>
<div class="simple-button">
    <button virtual-joystick="settings-joystick" emulate-button="settings-button">
        settings-label
    </button>
</div>
