<settings 
    width="80%" type-width="percentage" min-width="10" max-width="100" 
    height="80%" type-height="percentage" min-height="10" max-height="100" 
    label="Click Me" type-label="string" 
    thumb_color="green" type-thumb_color="color"
    background_color="blue" type-background_color="color"
    progress_color="red" type-progress_color="color"
    joystick="0" type-joystick="number" min-joystick="0" max-joystick="9" 
    slider="0" type-slider="number" min-slider="0" max-slider="7"
></settings>
<style>
    .v-slider {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100%;
        width: 100%;
    }

    .v-slider input {
        -webkit-appearance: none;
        appearance: none;
        width: 60%;
        height: 100%;
        writing-mode: vertical-lr;
        direction: rtl;
        background: var(--background-color, #17ada89b);
        border-radius: 4px;
        outline: none;
        overflow: hidden;
        touch-action: none;
    }

    /* Chromium Track */
    .v-slider input::-webkit-slider-runnable-track {
        width: 100%;
        background: transparent;
        cursor: pointer;
    }

    /* Chromium Thumb */
    .v-slider input::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 6vmin;
        width: 100%;
        background: var(--thumb-color, #56f6f1);
        /* border: 2px solid #fff; */
        border-radius: 4px;
        box-shadow: 0 calc(100vh + 8px) 0 100vh var(--progress-color, #009cf6);
        cursor: pointer;
    }

    /* Firefox Support */
    .v-slider input::-moz-range-track {
        width: 100%;
        height: 100%;
        background: transparent;
    }

    .v-slider input::-moz-range-progress {
        background: var(--progress-color, #009cf6);
        width: 100%;
    }

    .v-slider input::-moz-range-thumb {
        height: 6vmin;
        width: 100%;
        background: var(--thumb-color, #56f6f1);
        /* border: 2px solid #fff; */
    }

    .v-slider p {
        text-align: center;
        color: white;
        margin: 0;
        margin-bottom: 5px;
    }
</style>
<div class="v-slider"style="
        --thumb-color: settings-thumb_color;
        --background-color: settings-background_color;
        --progress-color: settings-progress_color;
        "
    >
    <p>settings-label</p>
    <input virtual-joystick="settings-joystick" emulate-slider="settings-slider" type="range" min="0" max="255" value="0" orient="vertical">
</div>
