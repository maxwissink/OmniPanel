<settings 

    joystick="0" type-joystick="number" min-joystick="0" max-joystick="9"
    button="0" type-button="number" min-button="0" max-button="15"
    label="Click Me" type-label="text"
    font_size="12" type-font_size="number" min-font_size="1"
    width="80%" type-width="percentage" min-width="10" max-width="100"
    height="80%" type-height="percentage" min-height="10" max-height="100"
    border_radius="5" type-border_radius="number" min-border_radius="0" max-border_radius="100"
    button_color="#cecece" type-button_color="color"
    button_color_active="#1ccad8" type-button_color_active="color"
    label_color="#333333ff" type-label_color="color"
></settings>
<style>
    .simple-button {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .simple-button button {
        width: var(--width);
        height: var(--height);
        background-color: var(--button-color);
        padding: 0;
        color: oklab(85.142% 0 -0.0001);
        color: var(--label-color);
        box-shadow: 0cqmin 0cqmin 1cqmax 1cqmin #00000055 inset, 0cqmin 0cqmin 1cqmin 0.5cqmin #00000055 ;
        border-radius: calc(var(--border-radius) * 1px);
        border-style: none;
        font-size: calc(var(--font-size) * 0.2cqmin);
    }
    .simple-button button:active{
        background-color: var(--button-color-active);
        box-shadow: 0cqmin 0cqmin 3cqmax 1cqmin #00000055 inset, 0cqmin 0cqmin 1cqmin 0.5cqmin #00000055 
    }
</style>
<div class="simple-button" style="--font-size: settings-font_size; --width: settings-width; --height: settings-height; --button-color: settings-button_color; --label-color: settings-label_color; --button-color-active: settings-button_color_active; --border-radius: settings-border_radius;">
    <button virtual-joystick="settings-joystick" emulate-button="settings-button">
        settings-label
    </button>
</div>
