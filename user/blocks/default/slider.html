<settings 
    width="80%" type-width="percentage" min-width="10" max-width="100" 
    height="80%" type-height="percentage" min-height="10" max-height="100" 
    label="Click Me" type-label="string" color="green" type-color="color" 
    joystick="0" type-joystick="number" min-joystick="0" max-joystick="9" 
    slider="0" type-slider="number" min-slider="0" max-slider="7"
></settings>
<style>
    .slider {
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100%;
        width: 100%;
    }

    .slider input {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 60%;
        /* Sliders look better not taking full button height */
        background: #56f6f140;
        border-radius: 4px;
        outline: none;
        overflow: hidden;
        /* Critical for shadow trick */
        touch-action: none;
    }

    /* Chromium Track */
    .slider input::-webkit-slider-runnable-track {
        height: 100%;
        background: transparent;
        cursor: pointer;
    }

    /* Chromium Thumb */
    .slider input::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 6vmin;
        /* Thumb size scales with screen */
        height: 100%;
        background: var(--primary-color);
        border: 2px solid #fff;
        /* The Box Shadow Trick */
        box-shadow: -100vw 0 0 100vw rgba(68, 173, 201, 0.8);
        cursor: pointer;
    }

    /* Firefox Support */
    .slider input::-moz-range-track {
        width: 100%;
        height: 100%;
        background: transparent;
    }

    .slider input::-moz-range-progress {
        background: var(--primary-color);
        height: 100%;
    }

    .slider input::-moz-range-thumb {
        width: 6vmin;
        height: 100%;
        background: var(--primary-color);
        border: 2px solid #fff;
    }

    .slider p {
        text-align: center;
        color: white;
        margin: 0;
    }
</style>
<div class="slider">
    <p>label</p>
    <input virtual-joystick="settings-joystick" emulate-slider="settings-slider" type="range" min="0" max="255" value="0">
</div>
