<settings width="80%" type-width="percentage" min-width="10" max-width="100" height="80%" type-height="percentage"
    min-height="10" max-height="100" 
    label="Label" type-label="string" 
    thumb_color="#2f97c1" type-thumb_color="color"
    background_color="#587291" type-background_color="color" 
    progress_color="#1ccad8" type-progress_color="color" 
    label_color="#333" type-label_color="color"
    font_size="12" type-font_size="number" min-font_size="1"
    joystick="0" type-joystick="number" min-joystick="0" max-joystick="9" 
    slider="0" type-slider="number" min-slider="0"max-slider="7"
></settings>
<style>
    .slider {
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100%;
        width: 100%;
        padding: 2cqmin;
        box-sizing: border-box;
    }

    .slider input {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 60%;
        background: var(--background-color);
        border-radius: 4px;
        outline: none;
        overflow: hidden;
        box-shadow: 0cqmin 0cqmin 1cqmax 1cqmin #00000055 inset, 0cqmin 0cqmin 1cqmin 0.5cqmin #00000055 ;

        /* Critical for shadow trick */
        touch-action: none;
    }

    /* Chromium Track */
    .slider input::-webkit-slider-runnable-track {
        height: 100%;
        background: transparent;
        cursor: pointer;
    }

    /* Chromium Thumb */
    .slider input::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 6vmin;
        /* Thumb size scales with screen */
        height: 100%;
        background: var(--thumb-color);
        /* border: 2px solid #fa0909; */
        border-radius: 4px;
        /* The Box Shadow Trick */
        box-shadow: calc(-100vw - 8px) 0 0 100vw var(--progress-color, #009cf6);
        cursor: pointer;
    }

    /* Firefox Support */
    .slider input::-moz-range-track {
        width: 100%;
        height: 100%;
        background: transparent;
    }

    .slider input::-moz-range-progress {
        background: var(--progress-color, #009cf6);
        height: 100%;
    }

    .slider input::-moz-range-thumb {
        width: 6vmin;
        height: 100%;
        background: var(--thumb-color, #56f6f1);
        border-radius: 4px;
        /* border: 2px solid #fff; */
    }

    .slider p {
        text-align: center;
        color: var(--label-color);
        font-size: calc(var(--font-size) * 0.2cqmin);
        margin: 0;
    }
</style>
<div class="slider" style="
        --thumb-color: settings-thumb_color;
        --background-color: settings-background_color;
        --progress-color: settings-progress_color;
        --label-color: settings-label_color;
        --font-size: settings-font_size;
        ">
    <p>settings-label</p>
    <input virtual-joystick="settings-joystick" emulate-slider="settings-slider" type="range" min="0" max="255"
        value="0">
</div>
