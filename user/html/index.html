<!DOCTYPE html>
<html>
<head>
    <title>Touchscreen Game Input</title>
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>
    <h1>Custom Game Controls</h1>
    
    <button emulate-key="u" class="control-button">Power</button>

    <button emulate-key="i" class="control-button">Weapons</button>

    <button emulate-key="o" class="control-button">Engines</button>

    <button emulate-key="p" class="control-button">Shields</button>

    <div id="status">Ready</div>
</body>
</html>
