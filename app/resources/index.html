<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniPanel</title>
    <link rel="stylesheet" href="css/style.css">
    </link>
    <script src="./js/config.js"></script>
    <script src="./js/log.js"></script>
    <script src="./js/info.js"></script>
</head>

<body>
    <div class="settings-panel">
        <div class="setting-item">
            <label for="url-display">Connection string: </label>
            <span id="url-display">local ipv4 address + the port in config.json</span>
        </div>
        
        <div class="setting-item">
            <label for="theme-select">Current Theme:</label>
            <select id="theme-select"></select>
        </div>

        <div class="setting-item">
            <label for="joystick-count">Number of Joysticks:</label>
            <input type="number" id="joystick-count" min="1" max="8" value="1">
        </div>
    </div>
    <div id="log-container">
        <div class="log-entry">Waiting for connection...</div>
    </div>
    <!-- <div class="test-area">
        <input placeholder="Input test area" type="text">
    </div> -->
</body>

</html>
