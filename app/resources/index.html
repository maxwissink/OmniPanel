<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniPanel</title>
    <link rel="stylesheet" href="css/style.css">
    </link>
    <script src="./js/config.js"></script>
    <script src="./js/log.js"></script>
    <script src="./js/info.js"></script>
    <script src="./js/edit-panel.js"></script>
    <script src="./js/control.js"></script>
</head>

<body>
    <h1>OmniPanel</h1>
    <div class="settings-panel">
        <div class="setting-item">
            <label for="url-display">Connection string: </label>
            <span id="url-display">local ipv4 address + the port in config.json</span><br>
            <button id="enter-fullscreen">Enter fullscreen</button>
            <button id="exit-fullscreen">Exit fullscreen</button>
        </div>

        <div class="setting-item">
            <label for="panel-select">Current Panel:</label>
            <select id="panel-select"></select>
            <button id="refresh">🗘</button>
        </div>
        <div class="setting-item">
            <button id="edit-panel-btn">Edit panel</button>
            <button id="new-panel-btn">New panel</button>
        </div>
    </div>
    <div id="log-container">
        <div class="log-entry">Waiting for connection...</div>
    </div>
</body>

</html>
