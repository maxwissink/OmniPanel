<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnipanel</title>
    <script src="client.js"></script>
    <style>
        :root {
            font-size: 100%;
        }

        html {
            font-size: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html * {
            font-weight: 700;
        }
        body{
            background-color: var(--workspace-bg, #fff);
        }

        .fullscreen-toggle {
            position: fixed;
            top: 2vmin;
            right: 2vmin;
            z-index: 9999;
            background: rgba(0, 40, 60, 0.7);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 1vmin 2vmin;
            font-size: clamp(0.7rem, 2vmin, 1rem);
            border-radius: 4px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>

<body style="overflow: hidden;">
    <h1>Something went wrong</h1>
    <p>Theme is not loaded...</p>
</body>

</html>
