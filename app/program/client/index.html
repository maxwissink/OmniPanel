<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnipanel</title>
    <script src="client.js"></script>
    <style>
        :root {
            font-size: 100%;
        }

        html {
            font-size: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html * {
            font-weight: 700;
        }

        body {
            background-color: var(--workspace-bg, #fff);
        }

        .fullscreen-toggle {
            position: fixed;
            top: 2vmin;
            right: 2vmin;
            z-index: 9999;
            background: rgba(0, 40, 60, 0.7);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 1vmin 2vmin;
            font-size: clamp(0.7rem, 2vmin, 1rem);
            border-radius: 4px;
            backdrop-filter: blur(5px);
        }

        #fullscreen-prompt {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: white;
            font-family: sans-serif;
            backdrop-filter: blur(5px);
        }

        .prompt-card {
            background: #222;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
        }

        .prompt-card button {
            margin-top: 1.5rem;
            padding: 12px 24px;
            font-size: 1.1rem;
            background: #0cf574;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .prompt-card button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body style="overflow: hidden;">
    <h1>Something went wrong</h1>
    <p>Panel is not loaded...</p>
</body>

</html>
