<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="editor-style.css">
    <script src="editor-renderer.js"></script>
    <title>Theme editor</title>
</head>

<body>
    <div class="openmenu">
        <button id="openmenu" onclick="OpenMenu()">hamburger</button>
    </div>
    <div id="menu">
        <div class="menucontainer">
            <h2 class="menu-title">blocks</h2>
            <div id="blocksconstainer"></div>
        </div>
        <div class="loadworkspace">
            <button onclick="loadWorkspace()">load</button>
        </div>
        <div class="saveworkspace">
            <button onclick="saveWorkspace()">save</button>
        </div>
        <div class="closemenu">
            <button id="closemenu" onclick="CloseMenu()">X</button>
        </div>
    </div>
    <div id="maincontainer">
    </div>
    <div id="settings-modal">
        <div class="modal-header">Block Settings</div>
        <div id="modal-fields"></div>
        <div class="modal-actions">
            <button onclick="closeSettingsModal()">Close</button>
        </div>
    </div>
    <div id="delete-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Delete Block?</h3>
            <p>This will permanently remove this block and everything inside it.</p>
            <div class="modal-actions">
                <button id="modal-cancel">Cancel</button>
                <button id="modal-confirm" class="danger">Delete</button>
            </div>
        </div>
    </div>
</body>

</html>
